[package]
name = "server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
default-run = "server"

[dependencies]
axum = { workspace = true, features = ["multipart"] }
dotenvy.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
serde_with = { version = "3", default-features = false, features = ["std"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
axum-login = "0.18"
tower-sessions = { version = "0.14", default-features = false, features = ["axum-core"] }
time = "0.3"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
infer = "0.19.0"
percent-encoding = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
roxmltree = "0.21.1"
uuid = { version = "1", features = ["v4"] }

rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"

[dev-dependencies]
migration = { path = "../migration" }
axum-test = "21"
sea-orm = { version = "1", features = ["sqlx-sqlite"] }
tower-sessions-sqlx-store = { version = "0.15", features = ["sqlite"] }
wiremock = "0.6"
